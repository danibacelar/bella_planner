<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Isabella's Study Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: sticky-free single column. Header + this-week hero, scrollable tab bar, then one view at a time.
   Palette: lilac ground, indigo ink, one color per subject (CIE blue, reading teal, spelling orange, cursive pink, summary coral, tutoring gold). */
:root{
  --bg:#f3f0ff; --surface:#ffffff; --surface2:#faf8ff; --ink:#2a2150; --muted:#655e8c; --line:#e0daf5;
  --brand:#6247e6; --brand-ink:#ffffff; --focus:#2a2150;
  --cie:#2f6fe4; --read:#0b8f78; --spell:#d9690c; --cursive:#d6338a; --summary:#d8433f; --tutor:#f0b400; --plan:#7a6cc4; --custom:#5b5f7a; --catch:#7a6cc4;
  --good:#1f9d55; --late:#d8433f; --chk:#ffffff;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif; --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif; --script:'Dancing Script','Brush Script MT',cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171332; --surface:#231d47; --surface2:#1d1840; --ink:#f1edff; --muted:#b0a9d9; --line:#3a3268;
  --brand:#9d88ff; --brand-ink:#17123a; --focus:#f1edff;
  --cie:#6aa0ff; --read:#34d3b4; --spell:#ffa24a; --cursive:#ff7ac0; --summary:#ff7a74; --tutor:#ffc933; --plan:#a89bf0; --custom:#9aa0c4; --catch:#a89bf0;
  --good:#4ade80; --late:#ff7a74; --chk:#17123a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171332; --surface:#231d47; --surface2:#1d1840; --ink:#f1edff; --muted:#b0a9d9; --line:#3a3268;
  --brand:#9d88ff; --brand-ink:#17123a; --focus:#f1edff;
  --cie:#6aa0ff; --read:#34d3b4; --spell:#ffa24a; --cursive:#ff7ac0; --summary:#ff7a74; --tutor:#ffc933; --plan:#a89bf0; --custom:#9aa0c4; --catch:#a89bf0;
  --good:#4ade80; --late:#ff7a74; --chk:#17123a; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-top:16px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.2;margin:0;text-wrap:balance}
h2{font-size:1.35rem} h3{font-size:1.1rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:9px 12px;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical;min-height:96px;line-height:1.5}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.9rem;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.88rem}
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.grid2>*{min-width:0}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:14px 24px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1;gap:2px}
.script{font-family:var(--script);font-size:clamp(3rem,9vw,4.6rem);line-height:1;color:var(--cursive)}
.brand .title{font-family:var(--display);font-size:clamp(1.2rem,3.6vw,1.8rem);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.status{font-size:.85rem;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:6px}
.status i{width:10px;height:10px;border-radius:50%;background:var(--good);display:inline-block}
.status.warn i{background:var(--spell)}
.weekbadge{background:var(--brand);color:var(--brand-ink);border-radius:20px;padding:12px 18px;display:flex;flex-direction:column;gap:3px;min-width:min(100%,230px);box-shadow:0 5px 0 color-mix(in srgb,var(--brand) 55%,#000)}
.weekbadge .k{font-weight:800;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;opacity:.9}
.weekbadge .d{font-family:var(--display);font-size:1.4rem;line-height:1.15}
.weekbadge .l{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.weekbadge .p{background:var(--tutor);color:#2a2150;border-radius:999px;padding:1px 12px;font-weight:800;font-size:.95rem}
.hero{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center}
.hero .lab{font-weight:800}
.hero .pct{font-family:var(--display);font-size:1.5rem;line-height:1}
.hero .msg{grid-column:1/4;font-size:.9rem;font-weight:700;color:var(--muted)}
.goalhero{background:var(--read);color:var(--chk);border-radius:22px;padding:20px 22px;display:flex;flex-direction:column;gap:6px;box-shadow:0 5px 0 color-mix(in srgb,var(--read) 55%,#000)}
.goalhero .gk{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:.9rem}
.goalhero .gt{font-family:var(--display);font-size:clamp(2rem,6vw,3rem);line-height:1.1}
.goalhero .gs{font-weight:700;opacity:.9}
.goalhero .gb{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;font-weight:800;margin-top:6px}
.goalhero .bar{background:color-mix(in srgb,var(--chk) 25%,transparent);height:16px}.goalhero .bar i{background:var(--chk)}
.goalhero .gm{background:color-mix(in srgb,var(--chk) 18%,transparent);border-radius:12px;padding:8px 12px;font-weight:800;margin-top:6px}
.rpg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.rpc{border:2px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;background:var(--surface2)}
.rpc .em{font-size:1.9rem;line-height:1.1}.rpc .rch{font-family:var(--display);font-size:1.15rem}
.rpc.done{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.rpc.late{border-color:var(--late);background:color-mix(in srgb,var(--late) 10%,var(--surface))}
.rpc.late .st{color:var(--late);font-weight:800}
.rpc.now{border-color:var(--read)}.rpc.sel{box-shadow:0 0 0 3px var(--brand)}
.rpc .bar{margin-top:6px;height:8px}
.hero .chip{border-color:color-mix(in srgb,var(--brand-ink) 55%,transparent)}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.tab{flex:none;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;font-weight:800;font-size:.95rem}
.tab[aria-current="page"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* controls */
.btn{border:2px solid var(--brand);background:var(--brand);color:var(--brand-ink);border-radius:12px;padding:8px 16px;font-weight:800}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:4px 12px;font-size:.88rem;border-radius:10px}
.btn.danger{background:transparent;border-color:var(--line);color:var(--late)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.nav .ttl{font-family:var(--display);font-size:1.25rem;text-align:center;flex:1;min-width:150px}
.x{border:0;background:transparent;color:var(--muted);font-weight:800;font-size:1.1rem;padding:2px 8px;border-radius:8px}

/* bars */
.bar{height:14px;border-radius:999px;background:color-mix(in srgb,var(--c,var(--brand)) 16%,var(--surface));overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--c,var(--brand));transition:width .4s}
.goal{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.goal b{font-weight:800}.goal .n{font-family:var(--display);font-weight:600}
.goal .bar{grid-column:1/3}
.goal.ok .n::after{content:" ✓";color:var(--good)}

/* tasks */
.tasks{display:flex;flex-direction:column;gap:8px}
.tw{display:flex;align-items:stretch;gap:6px}
.task{position:relative;flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;cursor:pointer;
  background:color-mix(in srgb,var(--c) 11%,var(--surface));border:2px solid color-mix(in srgb,var(--c) 28%,var(--surface))}
.task input{position:absolute;opacity:0;width:0;height:0}
.task .box{width:28px;height:28px;border-radius:9px;border:3px solid var(--c);background:var(--surface);flex:none;display:grid;place-items:center}
.task input:checked+.box{background:var(--c)}
.task input:checked+.box::after{content:"";width:7px;height:13px;border:solid var(--chk);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.task input:focus-visible+.box{outline:3px solid var(--focus);outline-offset:2px}
.task .lbl{flex:1;min-width:0;font-weight:700}
.task.done .lbl{text-decoration:line-through;opacity:.65}
.task .tag{font-size:.78rem;font-weight:800;color:var(--c);white-space:nowrap}
.t-cie{--c:var(--cie)}.t-read{--c:var(--read)}.t-spell{--c:var(--spell)}.t-cursive{--c:var(--cursive)}.t-summary{--c:var(--summary)}
.t-tutor{--c:var(--tutor);--chk:#2a2150}.t-plan{--c:var(--plan)}.t-catch{--c:var(--catch)}.t-custom{--c:var(--custom)}
@media (prefers-reduced-motion:no-preference){.task input:checked+.box{animation:pop .25s}@keyframes pop{50%{transform:scale(1.2)}}}

.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-weight:800;font-size:.8rem;white-space:nowrap}
.badge.gold{background:var(--tutor);color:#2a2150}
.badge.today{background:var(--ink);color:var(--bg)}

/* week */
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.day{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.day.tutor{border-color:var(--tutor);background:color-mix(in srgb,var(--tutor) 9%,var(--surface))}
.day.today{box-shadow:0 0 0 3px var(--brand)}
.day>header{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dayname{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;line-height:1.15;flex:1}
.dayname b{font-family:var(--display);font-size:1.15rem}.dayname span{font-size:.82rem;color:var(--muted);font-weight:700}
.cnt{font-family:var(--display);color:var(--muted)}
.day .bar{height:9px}

/* month */
.mhead,.mrow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mhead div{text-align:center;font-weight:800;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.wkcap{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.82rem;font-weight:800;color:var(--muted);margin:10px 0 4px}
.cell{border:2px solid var(--line);background:var(--surface);border-radius:12px;min-height:76px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.cell.out{opacity:.45}
.cell.tutor{border-color:var(--tutor);background:color-mix(in srgb,var(--tutor) 12%,var(--surface))}
.cell.today{box-shadow:0 0 0 3px var(--brand)}
.cell .d{font-family:var(--display);font-weight:600;display:flex;justify-content:space-between}
.cell .ct{font-size:.78rem;font-weight:800;color:var(--muted)}
.cell.late .ct{color:var(--late)}
.cell.full .ct{color:var(--good)}
.cell .bar{height:6px}
@media (max-width:560px){.cell{min-height:58px;padding:4px}.cell .ct{font-size:.7rem}.cell .st{display:none}}

/* misc content */
.note-item{border-left:5px solid var(--c,var(--brand));padding:8px 12px;background:var(--surface2);border-radius:0 12px 12px 0}
.od{background:color-mix(in srgb,var(--late) 8%,var(--surface));border-color:color-mix(in srgb,var(--late) 45%,var(--surface))}
.ok-box{background:color-mix(in srgb,var(--good) 10%,var(--surface));border-color:color-mix(in srgb,var(--good) 40%,var(--surface))}
.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}
.ch{border:3px solid var(--read);background:var(--surface);border-radius:12px;height:46px;font-family:var(--display);font-size:1.1rem}
.ch.on{background:var(--read);color:var(--chk)}
.ch.next{outline:3px dashed var(--brand);outline-offset:2px}
.book{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border:2px solid var(--line);border-radius:14px;background:var(--surface2)}
.book.cur{border-color:var(--read)}
.book .meta{flex:1;min-width:160px}
.tbl{width:100%;border-collapse:collapse;font-size:.95rem}
.tbl th{text-align:left;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 6px}
.tbl td{padding:4px 6px;border-top:1px solid var(--line);vertical-align:middle}
.tbl input{width:100%}
.scroll{overflow-x:auto}
.words{display:flex;flex-wrap:wrap;gap:8px}
.word{display:flex;align-items:center;gap:8px;border:2px solid var(--spell);border-radius:999px;padding:3px 6px 3px 12px;font-weight:800;background:color-mix(in srgb,var(--spell) 9%,var(--surface))}
.word.ok{background:var(--spell);color:var(--chk)}
.word button{border:0;background:transparent;font-weight:800}
.mood{display:flex;gap:8px;flex-wrap:wrap}
.mood button{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:6px 14px;font-weight:800}
.mood button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.achv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.a{border:2px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:2px;background:var(--surface2)}
.a .ic{font-size:1.6rem;line-height:1}
.a.on{border-color:var(--tutor);background:color-mix(in srgb,var(--tutor) 14%,var(--surface))}
.a:not(.on){opacity:.6;filter:grayscale(1)}
.a b{font-size:.9rem}.a span.s{font-size:.78rem;color:var(--muted)}
.roadmap{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.rw{border:2px solid var(--line);border-radius:12px;padding:6px 8px;font-size:.82rem;background:var(--surface2)}
.rw b{display:block;font-family:var(--display)}
.rw.cur{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 14%,var(--surface))}
.skill{border-color:var(--line);color:var(--muted)}.skill.on{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:16px;font-weight:800;z-index:9;max-width:90vw;text-align:center}
details>summary{cursor:pointer;font-weight:800}
.hint{font-size:.85rem;color:var(--muted)}
.lists{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.task.cur{box-shadow:0 0 0 3px var(--brand)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.two>*{min-width:0}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.bigscript{font-family:var(--script);font-size:3.2rem;line-height:1.2;color:var(--cursive)}

@media print{
  :root:root:root{--bg:#fff;--surface:#fff;--surface2:#fff;--ink:#000;--muted:#333;--line:#999;--brand:#444;--brand-ink:#fff;color-scheme:light}
  .noprint,.tabs,.status,.x,.btn,.toast{display:none!important}
  body{padding:0}.wrap{max-width:none}
  .card,.day,.cell{break-inside:avoid;border-width:1px}
  .hero{border:1px solid #000;color:#000;background:#fff}.hero .bar{background:#ddd}.hero .bar i{background:#000}
  .weekbadge,.goalhero{background:#fff;color:#000;border:1px solid #000;box-shadow:none}.weekbadge .p{background:#fff;border:1px solid #000}.goalhero .bar i{background:#000}
  .bar{border:1px solid #777}
  @page{margin:12mm}
}
</style>

<div class="wrap">
  <div class="top">
    <div class="brand"><span class="script" id="nameLine">Isabella's</span><span class="title">Study Planner</span>
      <div class="status noprint" id="savestat"><i></i><span>Saved</span></div></div>
    <div class="weekbadge" id="weekbadge"></div>
  </div>
  <section class="hero" id="hero"></section>
  <nav class="tabs noprint" id="tabs" aria-label="Planner sections"></nav>
  <main id="view" class="wrap" style="padding:0"></main>
</div>
<div id="toast" class="toast" hidden></div>

<script>
/* ---------- helpers ---------- */
const LS_KEY='isabella-planner-v1';
const DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const weekStart=s=>{const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
const TODAY=()=>iso(new Date());
const dowOf=s=>parse(s).getDay();
const short=s=>{const d=parse(s);return MON[d.getMonth()].slice(0,3)+' '+d.getDate()};
const longDate=s=>{const d=parse(s);return DOW[d.getDay()]+', '+MON[d.getMonth()]+' '+d.getDate()};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const getPath=(o,p)=>p.split('.').reduce((a,k)=>a==null?undefined:a[k],o);
function setPath(o,p,v){const k=p.split('.');let c=o;for(let i=0;i<k.length-1;i++){if(c[k[i]]==null||typeof c[k[i]]!=='object')c[k[i]]={};c=c[k[i]]}c[k[k.length-1]]=v}
const words=t=>(t.trim().match(/\S+/g)||[]).length;

/* ---------- plan template ---------- */
const T=(id,label,type)=>({id,label,type,base:true});
/* CIE Language Arts pacing: lessons per school week, starting with the week of Oct 12, 2026.
   Weeks 1-7 = 6 lessons each (1-42). Weeks 8-11 = fewer lessons while she reads City of Ember (43-57).
   To add more lessons later, add more numbers to PACE (lessons are numbered in order). */
const START_WEEK='2026-10-12';
const PACE=[6,6,6,6,6,6,6,4,4,4,3];
/* City of Ember (19 chapters) is split over the weeks from Oct 19 through lesson 57: chapters per school week
   (week 1 has no reading). 9 weeks of 2 chapters + 1 final chapter = 19. Add numbers here when the next book starts. */
const READ_GOALS=[0,2,2,2,2,2,2,2,2,2,1];
const readGoal=ws=>{const k=schoolWeek(ws)-1;return k>=0?(READ_GOALS[k]||0):0};
function readPlan(ws){const k=schoolWeek(ws)-1,goal=readGoal(ws);if(!goal)return null;const from=1+READ_GOALS.slice(0,k).reduce((a,b)=>a+b,0);return{week:k+1,goal,from,to:from+goal-1}}
function readItems(ws){const out=[];for(let i=0;i<5;i++){const d=addDays(ws,i),t=planFor(d).find(x=>x.type==='read');if(t)out.push({date:d,ch:t.chapter})}return out}
function planChaptersRead(ws){const rp=readPlan(ws);if(!rp)return S.readingLog.filter(e=>e.date>=ws&&e.date<=addDays(ws,6)).length;
 const b=bookById('ember');if(!b)return 0;const r=readSet(b);let c=0;for(let n=rp.from;n<=rp.to;n++)if(r.has(n))c++;return c}
function behindChapters(){const b=bookById('ember');if(!b)return[];const r=readSet(b),t=TODAY(),out=[];
 READ_GOALS.forEach((g,k)=>{if(g)readItems(addDays(weekStart(S.cycleStart),7*k)).forEach(x=>{if(x.date<t&&!r.has(x.ch))out.push(x.ch)})});return out}

 const plan=READ_GOALS.map((g,k)=>{if(!g)return'';const w=addDays(weekStart(S.cycleStart),7*k),rp2=readPlan(w),items=readItems(w),n=items.filter(x=>r2.has(x.ch)).length,late=items.filter(x=>x.date<TODAY()&&!r2.has(x.ch));
  const stt=n>=g?['✅','Done','done']:late.length?['⚠️','Behind: '+late.map(x=>'Ch. '+x.ch).join(', '),'late']:w===thisWs?['📖','This week','now']:['🗓️','Coming up','soon'];
  return`<div class="rpc ${stt[2]} ${w===ws?'sel':''}"><div class="em">${stt[0]}</div><b>Week ${k+1}</b><div class="rch">${chRange(rp2).replace('chapters','Ch.').replace('chapter','Ch.')}</div><div class="small muted">${short(w)} – ${short(addDays(w,4))}</div><div class="small st">${stt[1]}</div>${bar(Math.round(n/g*100),'var(--read)')}</div>`}).join('');
 return`${weekNav()}
 ${goalHero}
 ${cur}
 <div class="card"><h2>Reading plan: ${esc(book)}</h2><div class="rpg">${plan}</div></div>`}

function listGrid(kind){const cur=schoolWeek(weekStart(TODAY())),store=kind==='spell'?S.spellDone:S.cursiveDone;
 return`<div class="lists">${Array.from({length:32},(_,i)=>i+1).map(n=>{const on=!!store[n];
  return`<label class="task t-${kind} ${on?'done':''} ${n===cur?'cur':''}"><input type="checkbox" data-act="listCheck" data-kind="${kind}" data-n="${n}" ${on?'checked':''}><span class="box"></span><span class="lbl">${kind==='spell'?'Week '+n:'<b>Week '+n+'</b><br><span class="small">'+esc(lettersFor(n))+'</span>'}</span>${n===cur?'<span class="tag">this week</span>':''}</label>`}).join('')}</div>`}

function viewSpelling(){const n=schoolWeek(weekStart(TODAY())),done=Object.keys(S.spellDone).filter(k=>S.spellDone[k]).length;
 return`<div class="card" style="border-color:var(--spell)"><div class="row between"><h2>Spelling</h2><span class="badge" style="background:var(--spell);color:var(--chk)">${done} of 32 done</span></div>
  ${bar(Math.round(done/32*100),'var(--spell)')}
  <p>${n>=1&&n<=32?`This week is <b>Week ${n}</b>. Check the box when you have practiced the spelling list.`:'Check each week after you practice its spelling list.'}</p>
  ${listGrid('spell')}</div>`}

function viewCursive(){const ws=weekStart(TODAY()),n=schoolWeek(ws),ok=n>=1&&n<=32,done=Object.keys(S.cursiveDone).filter(k=>S.cursiveDone[k]).length;
 return`<div class="card" style="border-color:var(--cursive)"><div class="row between"><h2>Cursive letters this week</h2><span class="badge" style="background:var(--cursive);color:var(--chk)">${done} of 32 weeks done</span></div>
  ${ok?`<div class="bigscript">${esc(lettersFor(n))}</div><div class="tasks">${weeklyCheck('cursive',ws)}</div><p class="hint">Practice these letters with pencil and paper, then check the box.</p>
  <details class="noprint"><summary>Change this week's letters</summary><label class="f" style="margin-top:8px">Letters<input type="text" data-bind="cursiveLetters.${n}" data-re="1" value="${esc(lettersFor(n))}"></label></details>`:'<p>No letters are planned for this week. Set the start date in Settings.</p>'}
  ${bar(Math.round(done/32*100),'var(--cursive)')}</div>
 <div class="card"><h2>Letters for every week</h2>${listGrid('cursive')}</div>`}

const TABS=[['today','Today'],['week','Week'],['month','Month'],['reading','Reading'],['spelling','Spelling'],['cursive','Cursive']];
const VIEWS={today:viewToday,week:viewWeek,month:viewMonth,reading:viewReading,spelling:viewSpelling,cursive:viewCursive};

function render(){
 document.getElementById('nameLine').textContent=(S.name||'My')+(S.name?"'s":'');
 const ws=weekStart(TODAY()),st=weekStats(ws),wi=weekInfo(ws);
 const m=st.pct===100?'Perfect week! You finished everything!':st.pct>=80?'Almost there! Finish strong!':st.pct>=40?'More than halfway. Keep it up!':st.pct>0?'Great start. One task at a time!':'Fresh week! Begin with one lesson.';
 document.getElementById('weekbadge').innerHTML=`<span class="k">This week</span><span class="d">${short(ws)} – ${short(addDays(ws,6))}</span><span class="l"><span class="p">Week ${wi.num}</span>${lessonWeek(ws)?`<span class="p">Lessons ${lessonWeek(ws).first}–${lessonWeek(ws).last}</span>`:''}</span>`;
 document.getElementById('hero').innerHTML=`<span class="lab">Weekly progress</span>${bar(st.pct)}<span class="pct">${st.pct}%</span><div class="msg">${m}</div>`;
 document.getElementById('tabs').innerHTML=TABS.map(([k,l])=>`<button class="tab" data-act="tab" data-tab="${k}" ${ui.tab===k?'aria-current="page"':''}>${l}</button>`).join('');
 document.getElementById('view').innerHTML=VIEWS[ui.tab]();
 setStatus()}

/* ---------- actions ---------- */
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600)}
function toggleTask(ds,id,on){const key=ds+'|'+id,t=tasksFor(ds).find(x=>x.id===id);
 if(on)S.done[key]=true;else delete S.done[key];
 if(t&&t.type==='read'){
  if(on){const b=(t.bookId&&bookById(t.bookId))||curBook();if(b){const n=t.chapter?(readSet(b).has(t.chapter)?null:t.chapter):nextChapter(b);if(n)S.readingLog.push({id:uid(),date:ds,bookId:b.id,chapter:n,note:'',src:key})}}
  else S.readingLog=S.readingLog.filter(e=>e.src!==key)}
 save();render();
 if(on){const ds2=dayStats(ds);if(ds2.total&&ds2.done===ds2.total)toast('Everything done for the day. Awesome work!');
  else if(t&&t.type==='read')toast('Chapter logged in your reading tracker');}}

const A={
 tab:e=>{ui.tab=e.dataset.tab;render();window.scrollTo(0,0)},
 toggle:()=>{},
 prevDay:()=>{ui.date=addDays(ui.date,-1);render()},nextDay:()=>{ui.date=addDays(ui.date,1);render()},today:()=>{ui.date=TODAY();render()},
 prevWeek:()=>{ui.date=addDays(ui.date,-7);render()},nextWeek:()=>{ui.date=addDays(ui.date,7);render()},thisWeek:()=>{ui.date=TODAY();render()},
 prevMonth:()=>shiftMonth(-1),nextMonth:()=>shiftMonth(1),thisMonth:()=>{ui.month=TODAY().slice(0,7);render()},
 gotoDay:e=>{ui.date=e.dataset.date;ui.tab='today';render();window.scrollTo(0,0)},
 addTask:()=>{const el=document.getElementById('newTask'),v=el.value.trim();if(!v)return;S.custom.push({id:'c'+uid(),date:ui.date,text:v});save();render()},
 delTask:e=>{S.custom=S.custom.filter(c=>c.id!==e.dataset.id);delete S.done[ui.date+'|'+e.dataset.id];save();render()},
 chap:e=>{const b=curBook();if(!b)return;const n=+e.dataset.n,i=S.readingLog.findIndex(x=>x.bookId===b.id&&x.chapter===n);
  if(i>=0){const src=S.readingLog[i].src;S.readingLog.splice(i,1);if(src)delete S.done[src]}else S.readingLog.push({id:uid(),date:TODAY(),bookId:b.id,chapter:n,note:'',src:''});save();render()},
 bookCur:e=>{S.books.forEach(b=>{if(b.status==='current')b.status='next'});S.books[+e.dataset.i].status='current';save();render()},
 bookDone:e=>{const b=S.books[+e.dataset.i],was=b.status==='current';b.status='done';if(was){const nx=S.books.find(x=>x.status==='next');if(nx)nx.status='current'}save();render();toast('Book finished! What an achievement!')},
 addBook:()=>{const t=document.getElementById('bkTitle').value.trim();if(!t)return;S.books.push({id:'b'+uid(),title:t,author:document.getElementById('bkAuth').value.trim(),total:0,status:'next'});save();render()},
 delLog:e=>{const x=S.readingLog.splice(+e.dataset.i,1)[0];if(x&&x.src)delete S.done[x.src];save();render()},
 setval:e=>{setPath(S,e.dataset.path,e.dataset.val);save();render()},
 export:async()=>{try{const d=await claude.use('downloads');if(!d){toast('Saving files is not available here');return}await d.save({filename:'isabella-planner-backup.json',data:JSON.stringify(S,null,1)});toast('Backup saved')}catch(err){if(!err||err.code!=='declined')toast('Could not save the backup')}},
 savePrintWeek:()=>savePrint('week'),savePrintMonth:()=>savePrint('month')
};
function shiftMonth(n){const[y,m]=ui.month.split('-').map(Number),d=new Date(y,m-1+n,1);ui.month=d.getFullYear()+'-'+pad(d.getMonth()+1);render()}

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.tagName==='INPUT')return;const f=A[el.dataset.act];if(f)f(el)});
document.addEventListener('change',e=>{const el=e.target;
 if(el.dataset.act==='toggle'){toggleTask(el.dataset.date,el.dataset.id,el.checked);return}
 if(el.dataset.act==='listCheck'){const st=el.dataset.kind==='spell'?S.spellDone:S.cursiveDone;if(el.checked)st[el.dataset.n]=true;else delete st[el.dataset.n];save();render();if(el.checked)toast(el.dataset.kind==='spell'?'Spelling list done. Great job!':'Cursive practice done. Beautiful!');return}
 if(el.id==='importFile'&&el.files[0]){el.files[0].text().then(t=>{try{S=fixBooks(Object.assign(defaultState(),JSON.parse(t)));save();render();toast('Backup restored')}catch(err){toast('That file is not a planner backup')}});return}
 if(el.dataset.bind&&el.dataset.re){let v=el.value;if(el.dataset.num)v=v===''?0:+v;setPath(S,el.dataset.bind,v);save();render()}});
document.addEventListener('input',e=>{const el=e.target;if(!el.dataset||!el.dataset.bind||el.dataset.re)return;
 let v=el.value;if(el.dataset.num)v=v===''?0:+v;setPath(S,el.dataset.bind,v);save();
 if(el.dataset.count)document.getElementById(el.dataset.count).textContent=words(v)+' words'});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.enter){e.preventDefault();A[e.target.dataset.enter]()}});

/* ---------- printable pages (saved as a file because the viewer cannot open the print dialog) ---------- */
const PCSS='body{font-family:Arial,sans-serif;color:#000;margin:18px}h1{margin:0;font-size:22px}h2{font-size:14px;margin:8px 0 4px}.sub{color:#444;font-size:12px;margin-bottom:10px}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.d{border:1px solid #666;border-radius:6px;padding:6px;break-inside:avoid;font-size:12px}.d.t{border:2px solid #000;background:#f1f1f1}.d b{display:block;font-size:13px}.i{margin:3px 0}.m{display:grid;grid-template-columns:repeat(7,1fr)}.m div{border:1px solid #666;min-height:70px;padding:3px;font-size:11px}.m .h{min-height:0;background:#eee;font-weight:bold;text-align:center}.m .t{background:#f1f1f1}.n{border-bottom:1px solid #999;height:20px}@page{size:landscape;margin:10mm}';
function pdoc(title,body){return`<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)}</title><style>${PCSS}</style></head><body>${body}</body></html>`}
async function savePrint(kind){let html,name;
 if(kind==='week'){const ws=weekStart(ui.date),wi=weekInfo(ws),st=weekStats(ws);name='planner-week-'+ws+'.html';
  html=pdoc('Week of '+ws,`<h1>${esc(S.name)}'s Planner · ${short(ws)} – ${short(addDays(ws,6))}</h1><div class="sub">Week ${wi.num} · Goals: CIE lessons ${lessonWeek(ws)?lessonWeek(ws).first+'–'+lessonWeek(ws).last:'none planned'} (${st.by.cie[0]}/${st.by.cie[1]}), ${readPlan(ws)?'reading '+chRange(readPlan(ws))+' ('+st.chapters+'/'+readPlan(ws).goal+'), one reading summary':'no reading assigned'}</div><div class="g">${[0,1,2,3,4,5,6].map(i=>{const d=addDays(ws,i);return`<div class="d ${isTutor(d)?'t':''}"><b>${DOW[dowOf(d)]} ${short(d)}${isTutor(d)?' ★ Tutoring (30 min)':''}</b>${tasksFor(d).map(t=>`<div class="i">${isDone(d,t.id)?'☑':'☐'} ${esc(t.label)}</div>`).join('')||'<div class="i">Free day</div>'}</div>`}).join('')}<div class="d"><b>This week</b>${(()=>{const n=schoolWeek(ws);return n>=1&&n<=32?`<div class="i">${S.spellDone[n]?'☑':'☐'} Spelling Week ${n}</div><div class="i">${S.cursiveDone[n]?'☑':'☐'} Cursive: ${esc(lettersFor(n))}</div>`:''})()}</div></div>`)}
 else{const[y,m]=ui.month.split('-').map(Number),first=iso(new Date(y,m-1,1)),last=iso(new Date(y,m,0));name='planner-month-'+ui.month+'.html';
  let cells='';for(let ws=weekStart(first);ws<=last;ws=addDays(ws,7))for(let i=0;i<7;i++){const d=addDays(ws,i),inM=d.slice(0,7)===ui.month;cells+=`<div class="${isTutor(d)&&inM?'t':''}">${inM?`<b>${parse(d).getDate()}</b>${isTutor(d)?' ★ Tutoring':''}<br>${(dowOf(d)===1&&0)?'':''}`:''}</div>`}
  const wk=[];for(let ws=weekStart(first);ws<=last;ws=addDays(ws,7)){const wi=weekInfo(ws);wk.push(`Week ${wi.num} (${short(ws)})`)}
  html=pdoc(MON[m-1]+' '+y,`<h1>${MON[m-1]} ${y} · ${esc(S.name)}'s Planner</h1><div class="sub">★ = tutoring day (Tuesday and Thursday, 30 minutes)<br>${wk.map(esc).join(' · ')}</div><div class="m">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="h">${x}</div>`).join('')}${cells}</div>`)}
 try{const d=await claude.use('downloads');if(!d){toast('Use Ctrl+P (Cmd+P) to print this page');return}await d.save({filename:name,data:html});toast('Saved. Open the file and print it.')}catch(err){if(!err||err.code!=='declined')toast('Could not save. Try Ctrl+P (Cmd+P) instead.')}}

render();initCloud();
</script>
